# ==============================================================================
# LynxWAF Community Edition — Hardened Orchestration Stack
# Repository: https://github.com/ones006/LynxWAF-CE
#
# Principles:
#   • CIS Docker Benchmark Hardened (Non-Root, Cap-Drop ALL, Read-Only FS)
#   • L4/L7 High-Throughput Kernel Bypass / Direct Client IP Preservation
#   • Automated Health Checks & Auto-Recovery
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Data Plane: OpenResty WAF Reverse Proxy & Real-Time Inspection Engine
  # ----------------------------------------------------------------------------
  lynxwaf-openresty:
    image: ${LYNXWAF_OPENRESTY_IMAGE:-ghcr.io/ones006/lynxwaf-openresty:ce-latest}
    container_name: lynxwaf-openresty
    restart: always
    network_mode: "host" # High-throughput L4/L7 proxy with direct client IP preservation
    user: "0:0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
      - /opt/lynxwaf/openresty/nginx/client_body_temp:rw,noexec,nosuid,size=128m
      - /opt/lynxwaf/openresty/nginx/proxy_temp:rw,noexec,nosuid,size=128m
      - /opt/lynxwaf/openresty/nginx/fastcgi_temp:rw,noexec,nosuid,size=64m
      - /opt/lynxwaf/openresty/nginx/uwsgi_temp:rw,noexec,nosuid,size=64m
      - /opt/lynxwaf/openresty/nginx/scgi_temp:rw,noexec,nosuid,size=64m
    volumes:
      - ./data/nginx/logs:/opt/lynxwaf/openresty/nginx/logs:rw
      - ./data/nginx/logs:/www/wwwlogs:rw
      - ./data/nginx/logs:/usr/local/openresty/nginx/logs:rw
      - ./data/nginx/conf:/opt/lynxwaf/openresty/nginx/conf:ro
      - ./data/nginx/conf.d:/etc/nginx:ro
      # The WAF engine must append rule hits here; without a writable child mount
      # the interception log stays empty on every fresh install.
      - ./data/nginx/conf.d/waf/data:/etc/nginx/waf/data:rw
      - ./data/wwwroot:/www/wwwroot:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '0.25'
          memory: 256M
    ulimits:
      nofile:
        soft: 65535
        hard: 1000000
      core: 0
    depends_on:
      lynxwaf-mysql:
        condition: service_healthy
      lynxwaf-redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # 2. Control Plane: LynxWAF Go Controller & Cyber-SOC Management Console
  # ----------------------------------------------------------------------------
  lynxwaf-daemon:
    image: ${LYNXWAF_DAEMON_IMAGE:-ghcr.io/ones006/lynxwaf-daemon:ce-latest}
    container_name: lynxwaf-daemon
    restart: always
    ports:
      - "${LYNXWAF_BIND_IP:-0.0.0.0}:${LYNXWAF_PORT:-8379}:8379"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./config:/app/config:rw
      - ./logs:/app/logs:rw
      - ./data:/app/data:rw
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LYNXWAF_ENV=${LYNXWAF_ENV:-production}
      - LYNXWAF_PORT=8379
      - DB_HOST=lynxwaf-mysql
      - DB_PORT=3306
      - DB_USER=root
      - "DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"
      - DB_NAME=lynxwaf_db
      - MYSQL_HOST=lynxwaf-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - "MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"
      - MYSQL_DATABASE=lynxwaf_db
      - MYSQL_DB=lynxwaf_db
      - REDIS_HOST=lynxwaf-redis
      - REDIS_PORT=6379
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
      # No fallback value here on purpose. install.sh generates this secret; a
      # published default would be a credential anybody could log in with.
      - "INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set in .env}"
      - WAF_ENGINE_URL=${WAF_ENGINE_URL:-http://host.docker.internal}
      # ----------------------------------------------------------------------------
      # Outbound traffic. Everything below is unset by default, and unset means the
      # product default, which is off: a fresh CE container volunteers nothing.
      # The container's own updates come from the image, not from these switches.
      # ----------------------------------------------------------------------------
      - LYNXWAF_LICENSE_ACTIVATION=${LYNXWAF_LICENSE_ACTIVATION:-}
      - LYNXWAF_LICENSE_HEARTBEAT=${LYNXWAF_LICENSE_HEARTBEAT:-}
      - LYNXWAF_MONTHLY_REPORT=${LYNXWAF_MONTHLY_REPORT:-}
      # The address the console, its certificate SANs and the attack map use.
      # Inside a container the egress interface is the bridge network, so a host
      # reached through published ports declares its real address here; declaring
      # it also means no address lookup of any kind.
      - LYNXWAF_SERVER_IP=${LYNXWAF_SERVER_IP:-}
      - LYNXWAF_PUBLIC_IP_DETECTION=${LYNXWAF_PUBLIC_IP_DETECTION:-}
      # Signed vulnerability feed: unset keeps the catalog embedded in the binary.
      - LYNXWAF_VULN_FEED_URL=${LYNXWAF_VULN_FEED_URL:-}
      - LYNXWAF_CATALOG_PUBKEY=${LYNXWAF_CATALOG_PUBKEY:-}
      - LYNXWAF_CATALOG_PUBKEYS=${LYNXWAF_CATALOG_PUBKEYS:-}
      # Signed contents feeds: unset keeps the snapshot and blocklists on disk.
      - LYNXWAF_FEED_URL=${LYNXWAF_FEED_URL:-}
      - LYNXWAF_FEED_PUBKEY=${LYNXWAF_FEED_PUBKEY:-}
      - LYNXWAF_FEED_PUBKEYS=${LYNXWAF_FEED_PUBKEYS:-}
      # The exception to the opt-in rule above: the nightly blocklist refresh GETs
      # two public publisher pages (Tor exit list, Spamhaus DROP) unasked. The GET
      # carries no hostname or customer data, but it is still a request, so off
      # here means the schedule skips it and the stored addresses decay on their
      # own expiry clock rather than being emptied. Ignored when LYNXWAF_FEED_URL
      # names a signed mirror to fetch from instead.
      - LYNXWAF_THREAT_INTEL_SYNC=${LYNXWAF_THREAT_INTEL_SYNC:-}
      # Signed releases: unset means this host never asks anybody about updates.
      # A container installs nothing over its own image — the console says which
      # step it can do here, and the staged bundle appears under ./data/update/
      # staged on the host, where update_lynxwaf.sh --from-bundle can run on it.
      - LYNXWAF_UPDATE_URL=${LYNXWAF_UPDATE_URL:-}
      - LYNXWAF_RELEASE_PUBKEY=${LYNXWAF_RELEASE_PUBKEY:-}
      - LYNXWAF_RELEASE_PUBKEYS=${LYNXWAF_RELEASE_PUBKEYS:-}
      - LYNXWAF_UPDATE_TELEMETRY=${LYNXWAF_UPDATE_TELEMETRY:-}
      # /metrics answers a loopback scraper without a token; set one to scrape it
      # from outside the container.
      - LYNXWAF_METRICS_TOKEN=${LYNXWAF_METRICS_TOKEN:-}
      # Report signing: empty means the container generates ./config/
      # report_signing.key on the first issued PDF and the key never leaves.
      - LYNXWAF_REPORT_SIGNING_KEY=${LYNXWAF_REPORT_SIGNING_KEY:-}
      - LYNXWAF_REPORT_SIGNING_KEY_FILE=${LYNXWAF_REPORT_SIGNING_KEY_FILE:-}
    depends_on:
      lynxwaf-mysql:
        condition: service_healthy
      lynxwaf-redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Telemetry & Analytics Database: Tuned MySQL 8.0 for WAF Log Ingestion
  # ----------------------------------------------------------------------------
  lynxwaf-mysql:
    image: mysql:8.0
    container_name: lynxwaf-mysql
    restart: always
    ports:
      - "127.0.0.1:33060:3306"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"
      MYSQL_DATABASE: lynxwaf_db
    volumes:
      - ./data/mysql/data:/var/lib/mysql:rw
      - ./data/mysql/log:/var/log/mysql:rw
      - /etc/localtime:/etc/localtime:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --skip-name-resolve
      --innodb_flush_log_at_trx_commit=2
      --innodb_buffer_pool_size=512M
      --innodb_log_buffer_size=32M
      --max_connections=300
      --table_open_cache=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. State & Challenge Cache: In-Memory Redis Engine
  # ----------------------------------------------------------------------------
  lynxwaf-redis:
    image: redis:7-alpine
    container_name: lynxwaf-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
