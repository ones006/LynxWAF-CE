name: Validate Docker Compose Configuration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy sample environment configuration
        run: cp .env.example .env

      - name: Validate Docker Compose Syntax
        run: |
          # The sample ships MYSQL_ROOT_PASSWORD, REDIS_PASSWORD and
          # INITIAL_ADMIN_PASSWORD empty, and compose refuses an empty required
          # variable, so a bare copy of the template must NOT validate. Assert that
          # before anything else: it is the only thing standing between this
          # repository and a re-added published default, which was the real failure
          # mode until the guards went in.
          if docker compose config --quiet 2>/dev/null; then
            echo "the empty sample environment validated - a secret default is back" >&2
            exit 1
          fi
          # Throwaway values for the remainder of this job and nothing else. A real
          # host gets its own from install.sh, written into .env with mode 0600.
          sed -i \
            -e 's|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=ci-only-mysql-secret|' \
            -e 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ci-only-redis-secret|' \
            -e 's|^INITIAL_ADMIN_PASSWORD=.*|INITIAL_ADMIN_PASSWORD=ci-only-admin-secret|' \
            .env
          docker compose config --quiet
          # The eBPF/XDP overlay is no longer a file in this repository - it grants
          # CAP_BPF/CAP_NET_ADMIN/CAP_SYS_ADMIN and the host network namespace, so it
          # must not be distributed as source. Operators write what the documentation
          # shows, therefore the documented snippet is the thing that has to merge with
          # the base stack: if it drifts, the failure belongs here and not on an
          # operator's server. Canonical text: modules/ebpf_overlay.go upstream.
          awk '/LYNXWAF-XDP-OVERLAY-START/{f=1;next} /LYNXWAF-XDP-OVERLAY-END/{f=0} f && !/^```/' docs/TROUBLESHOOTING.md > docker-compose.ebpf.yml
          test -s docker-compose.ebpf.yml
          grep -q '^services:$' docker-compose.ebpf.yml
          docker compose -f docker-compose.yml -f docker-compose.ebpf.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ebpf.yml config | grep -q 'network_mode: host'
          # Least privilege is a contract. Only effective lines count here - the
          # comments are allowed to name capabilities the overlay must not add, and
          # the base stack keeps its own caps for mysql/redis.
          effective="$(grep -v '^[[:space:]]*#' docker-compose.ebpf.yml)"
          echo "$effective" | grep -A2 '^    cap_add:' | grep -q 'BPF'
          echo "$effective" | grep -A2 '^    cap_add:' | grep -q 'NET_ADMIN'
          echo "$effective" | grep -A3 '^    cap_add:' | grep -q 'SYS_ADMIN'
          test "$(echo "$effective" | sed -n '/^    cap_add:/,/^    security_opt:/p' | grep -c '^      - ')" -eq 3
          ! echo "$effective" | grep -qE 'NET_RAW|DAC_OVERRIDE|NET_BIND_SERVICE|SETUID|SETGID'
          # The daemon must stay uid 1000. Forcing user: "0:0" to make cap_add apply
          # was the original design and it crash-looped the container: cap_drop: ALL
          # also removes CAP_DAC_OVERRIDE, so that process cannot reopen ./data/.lock
          # (0600) that the uid-1000 instance created.
          ! echo "$effective" | grep -qE '^[[:space:]]+user:'
          # The image carries the three capabilities as file capabilities on
          # /app/LynxWaf, and the kernel gives a capped binary an empty permitted set
          # under no-new-privileges. Compose appends the sequence, so this entry has to
          # land after the base file's "true" - assert the merged result, not the file.
          echo "$effective" | grep -q 'no-new-privileges:false'
          merged="$(docker compose -f docker-compose.yml -f docker-compose.ebpf.yml config)"
          # Service blocks sit at two spaces in "config" output; take only the daemon's.
          daemon_merged="$(printf '%s\n' "$merged" | sed -n '/^  lynxwaf-daemon:/,/^  [a-z0-9_-]*:$/p')"
          nnp_lines="$(printf '%s\n' "$daemon_merged" | grep 'no-new-privileges:' || true)"
          if [ "$(printf '%s\n' "$nnp_lines" | grep -c . )" -lt 2 ]; then
            echo "the base no-new-privileges:true survived unmerged - the overlay entry is not being appended" >&2
            exit 1
          fi
          # The runtime reads the list in order and the last value wins, so the appended
          # overlay entry is the effective one.
          if ! printf '%s\n' "$nnp_lines" | tail -1 | grep -q false; then
            echo "the merged daemon config still enforces no-new-privileges - the file capabilities would be inert" >&2
            exit 1
          fi
          if printf '%s\n' "$daemon_merged" | grep -qE '^[[:space:]]+user:'; then
            echo "the merged daemon runs as root; the overlay must keep it uid 1000" >&2
            exit 1
          fi
          rm -f docker-compose.ebpf.yml

      - name: Validate Shell Scripts Syntax
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n uninstall.sh
          bash -n test_poc_simulation.sh
          # A host that cannot reach GHCR installs from an archive; the flag has to keep
          # existing even if nobody uses it on a connected host.
          bash install.sh --help | grep -q -- '--offline'

      # Walks the updater through preflight, self-sync, snapshot and the dry-run
      # exit using a throwaway install tree and a stubbed docker CLI, so a
      # regression in update.sh fails here instead of on an operator's server.
      - name: Dry-run the updater against a synthetic install
        run: |
          set -eo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/bin" "$work/inst/config" "$work/inst/data/nginx"
          cp update.sh "$work/inst/update.sh"
          cp docker-compose.yml "$work/inst/docker-compose.yml"
          cp .env "$work/inst/.env"
          echo '{"data":{"tier":"community","max_domains":1},"signature":"x"}' > "$work/inst/config/lynxwaf.lic"
          cat > "$work/bin/docker" <<'SHIM'
          #!/usr/bin/env bash
          case "$1" in
            info) exit 0 ;;
            compose) exit 0 ;;
            image) echo "sha256:0000000000000000"; exit 0 ;;
            inspect) echo "true"; exit 0 ;;
            exec) echo "ci-dry-run"; exit 0 ;;
            *) exit 0 ;;
          esac
          SHIM
          chmod +x "$work/bin/docker"
          PATH="$work/bin:$PATH" bash "$work/inst/update.sh" --dry-run
          test -s "$work/inst"/logs/pre-update-*.txt
          # --offline exists for hosts that cannot reach GHCR. It must plan a load and
          # never a pull, and it must refuse to run when no archive is present - the
          # silent alternative is recreating from a stale local image.
          mkdir -p "$work/inst/offline"
          echo dummy > "$work/inst/offline/lynxwaf-ci.tar"
          PATH="$work/bin:$PATH" bash "$work/inst/update.sh" --dry-run --offline > "$work/offline.plan"
          grep -q 'docker load -i' "$work/offline.plan"
          ! grep -q 'compose pull' "$work/offline.plan"
          rm -rf "$work/inst/offline"
          if PATH="$work/bin:$PATH" bash "$work/inst/update.sh" --dry-run --offline >/dev/null 2>&1; then
            echo "--offline without an archive must fail, not fall back to the registry" >&2
            exit 1
          fi

      # The engine http block used to include /etc/nginx/user/*.conf. Those are per-site
      # snippets, and every vhost already includes its own inside its server block; at
      # http level a snippet that sets client_max_body_size duplicates the one the block
      # sets, nginx refuses the whole configuration, and the supervisor keeps serving
      # the boot-time config while every reload is rejected. That is how imported sites
      # ended up written, reported as saved, and unreachable. The real engine image is
      # the oracle here: the shipped template must validate with such a snippet, and
      # re-inserting the http-level glob into the same run must fail.
      - name: Engine configuration must reject the http-level site include
        run: |
          set -eo pipefail
          ! grep -q 'include /etc/nginx/user/\*\.conf;' install.sh scripts/nginx.conf

          work="$RUNNER_TEMP/engine-conf"
          mkdir -p "$work/main" "$work/etc/conf.d" "$work/etc/vhost" "$work/etc/user"
          # The main config lives outside the included directory, as it does on a host,
          # so the include globs cannot match the file that contains them.
          sed 's#/etc/nginx/#/etc/nginx-test/#g' scripts/nginx.conf > "$work/main/nginx.conf"
          cp scripts/mime.types "$work/main/mime.types"
          printf 'client_max_body_size 50m;\nadd_header X-Site "one";\n' > "$work/etc/user/site.test.conf"
          cat > "$work/etc/vhost/site.test.conf" <<'CONF'
          server {
              listen 18080;
              server_name site.test;
              location / { return 200 'ok'; }
              include /etc/nginx-test/user/site.test.conf;
          }
          CONF

          image=ghcr.io/ones006/lynxwaf-openresty:ce-latest
          docker pull -q "$image" >/dev/null
          engine_test() {
            docker run --rm --user 0:0 \
              -v "$work/main:/etc/nginx-main:ro" \
              -v "$work/etc:/etc/nginx-test:ro" \
              --entrypoint /opt/lynxwaf/openresty/nginx/sbin/nginx \
              "$image" -t -p /opt/lynxwaf/openresty/nginx -c "/etc/nginx-main/$1" 2>&1
          }
          engine_test nginx.conf > "$work/positive.log"
          grep -q 'test is successful' "$work/positive.log"

          sed 's#^    include /etc/nginx-test/vhost/\*\.conf;#&\n    include /etc/nginx-test/user/*.conf;#' \
            "$work/main/nginx.conf" > "$work/main/nginx-negative.conf"
          grep -q 'include /etc/nginx-test/user/\*\.conf;' "$work/main/nginx-negative.conf"
          status=0
          output="$(engine_test nginx-negative.conf)" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "the http-level site include validated - the duplicate guard is gone" >&2
            echo "$output" >&2
            exit 1
          fi
          echo "$output" | grep -q 'directive is duplicate'

      # The host exposure report is the installers' only word about firewalls, and it
      # earns that role by changing nothing. Both halves need enforcing: the function
      # is defined twice (install.sh and update.sh cannot source each other), and a
      # report that can fail would abort an install under set -e - which is how an
      # advisory becomes an outage.
      - name: Host exposure report stays advisory and in sync
        run: |
          set -eo pipefail
          sed -n '/^# BEGIN HOST-POSTURE/,/^# END HOST-POSTURE/p' install.sh > "$RUNNER_TEMP/posture.install"
          sed -n '/^# BEGIN HOST-POSTURE/,/^# END HOST-POSTURE/p' update.sh > "$RUNNER_TEMP/posture.update"
          test -s "$RUNNER_TEMP/posture.install"
          if ! cmp -s "$RUNNER_TEMP/posture.install" "$RUNNER_TEMP/posture.update"; then
            echo "the two copies of report_host_posture have drifted" >&2
            diff "$RUNNER_TEMP/posture.install" "$RUNNER_TEMP/posture.update" >&2 || true
            exit 1
          fi
          grep -q 'report_host_posture || true' install.sh
          grep -q 'report_host_posture || true' update.sh

          # One mutating command here could lock an operator out of the very SSH
          # session the install is running over, so the contract is greppable.
          if grep -nE 'ufw +(allow|deny|limit|delete|disable|enable|default)|firewall-cmd +--(add|remove|change|permanent|reload)|iptables +-(A|I|D|P|F|X)|nft +(add|delete|flush|create)' \
               "$RUNNER_TEMP/posture.install"; then
            echo "the exposure report writes firewall rules; it is advisory by contract" >&2
            exit 1
          fi

          # Run it the way the installers do - set -e, and against a directory with no
          # LynxWAF installed and no .env: the worst host this function can meet, and it
          # still has to return 0.
          bare="$(mktemp -d)"
          bash -c 'set -eo pipefail; . "$1"; POSTURE_DIR="$2"; report_host_posture' \
            _ "$RUNNER_TEMP/posture.install" "$bare" > "$RUNNER_TEMP/posture.out"
          grep -q 'Host exposure report' "$RUNNER_TEMP/posture.out"
          grep -q 'deliberately writes no firewall rule' "$RUNNER_TEMP/posture.out"
          echo "report on a bare host:"
          sed 's/^/  /' "$RUNNER_TEMP/posture.out"
