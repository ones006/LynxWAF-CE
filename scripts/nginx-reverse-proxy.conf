# ==============================================================================
# LynxWAF Production & Lab Nginx Reverse Proxy Configuration
# Place this configuration in /etc/nginx/sites-available/lynxwaf.conf
# or include it inside your existing host reverse proxy.
# ==============================================================================

# Required for proper WebSocket connection upgrade negotiation
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lynxwaf_backend {
    # Adjust to your LynxWAF daemon host and port (default: 8379 or 8080)
    server 127.0.0.1:8379;
    keepalive 32;
}

server {
    listen 80;
    server_name waf.yourdomain.local; # Replace with your FQDN or IP

    # Redirect all HTTP traffic to HTTPS (Recommended)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name waf.yourdomain.local; # Replace with your FQDN or IP

    # SSL Configuration (Replace with your certificates)
    # ssl_certificate /etc/letsencrypt/live/waf.yourdomain.local/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/waf.yourdomain.local/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 128M;

    # --------------------------------------------------------------------------
    # 1. Real-Time Telemetry WebSocket Endpoint (CRITICAL FOR LAB/SERVER DASHBOARD)
    # --------------------------------------------------------------------------
    location /api/ws/ {
        proxy_pass https://lynxwaf_backend;
        
        # Mandatory WebSocket upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard client identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering and extend timeouts for long-lived WebSocket streaming
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # SSL backend verification bypass if self-signed cert is used on daemon
        proxy_ssl_verify off;
    }

    # --------------------------------------------------------------------------
    # 2. Web UI Console & REST API Endpoints
    # --------------------------------------------------------------------------
    location / {
        proxy_pass https://lynxwaf_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # SSL backend verification bypass if self-signed cert is used on daemon
        proxy_ssl_verify off;
    }
}
